[project]
name = "book-llm-wiki"
version = "0.1.0"
description = "Two-tier book-to-wiki pipeline: local CLI converts EPUBs, Claude Code slash command summarizes into an Obsidian LLM wiki."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
librarything = [
    # The `fetchers` extra carries StealthyFetcher's browser stack (curl_cffi,
    # playwright/patchright, camoufox). Bare `scrapling` stopped pulling it in
    # as of 0.4.13, so importing StealthyFetcher fails without it.
    # `scrapling install` must still be run once to fetch the browser binaries.
    "scrapling[fetchers]>=0.4.13",
]

[project.scripts]
book-llm-wiki = "book_llm_wiki.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["book_llm_wiki*"]
